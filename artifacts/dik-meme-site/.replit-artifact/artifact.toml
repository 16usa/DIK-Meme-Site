kind = "web"
previewPath = "/"
title = "DIK Meme Site"
description = "A self-contained DIK meme character landing page served by its included dependency-free Node server."
version = "1.0.0"
id = "artifacts/dik-meme-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24391

[services.development]
run = "pnpm --filter @workspace/dik-meme-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dik-meme-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/dik-meme-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24391"
BASE_PATH = "/"
