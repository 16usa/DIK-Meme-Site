kind = "web"
previewPath = "/"
title = "GIGA CAT"
description = "GIGA CAT landing page"
version = "1.0.1"
id = "artifacts/dik-meme-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24391

[services.development]
run = "pnpm --filter @workspace/dik-meme-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dik-meme-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/dik-meme-site/site"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24391"
BASE_PATH = "/"
